<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>连接 DataAgent 服务</title>
  <link rel="stylesheet" href="connection.css">
</head>
<body>
  <main>
    <div class="brand" aria-hidden="true">D</div>
    <p class="eyebrow">DATAAGENT</p>
    <h1>连接你的分析工作台</h1>
    <p class="description">填写团队提供的服务地址，连接后即可注册或登录。数据与分析任务保存在该服务中。</p>
    <form id="connection-form">
      <label for="server-url">服务地址</label>
      <input id="server-url" name="serverUrl" type="url" placeholder="https://data.example.com" autocomplete="url" spellcheck="false" required autofocus>
      <p class="hint">填写 HTTPS 根地址。本机开发可使用 http://localhost:3002。</p>
      <p id="status" role="status" aria-live="polite"></p>
      <button type="submit" id="connect-button">验证并连接</button>
    </form>
    <p class="footer">请向团队管理员获取服务地址。</p>
  </main>
  <script src="connection.js"></script>
</body>
</html>
